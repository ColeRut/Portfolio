<style>
  .gallery-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 12px;
    padding: 1rem 0;
  }
  .gallery-item {
    position: relative;
    overflow: hidden;
    border-radius: 8px;
    cursor: pointer;
    aspect-ratio: 1;
  }
  .gallery-item img {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
    transition: transform 0.25s ease;
  }
  .gallery-item:hover img { transform: scale(1.05); }
  .gallery-item .caption {
    position: absolute;
    bottom: 0; left: 0; right: 0;
    background: rgba(0,0,0,0.55);
    color: #fff;
    font-size: 12px;
    padding: 6px 10px;
    opacity: 0;
    transition: opacity 0.2s ease;
  }
  .gallery-item:hover .caption { opacity: 1; }

  .lightbox {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    z-index: 9999;
    align-items: center;
    justify-content: center;
    flex-direction: column;
  }
  .lightbox.open { display: flex; }
  .lightbox img {
    max-width: 90vw;
    max-height: 75vh;
    border-radius: 8px;
  }
  .lightbox-caption { color: #fff; font-size: 14px; margin-top: 12px; }
  .lightbox-close {
    position: absolute; top: 20px; right: 24px;
    background: none; border: none; color: #fff;
    font-size: 28px; cursor: pointer;
  }
  .lightbox-nav {
    position: absolute; top: 50%; transform: translateY(-50%);
    background: rgba(255,255,255,0.15); border: none; color: #fff;
    font-size: 28px; cursor: pointer; padding: 12px 16px; border-radius: 4px;
  }
  .lightbox-nav:hover { background: rgba(255,255,255,0.3); }
  .lightbox-nav.prev { left: 16px; }
  .lightbox-nav.next { right: 16px; }
</style>

<div class="gallery-grid" id="gallery"></div>

<div class="lightbox" id="lightbox">
  <button class="lightbox-close" id="lb-close">&#x2715;</button>
  <button class="lightbox-nav prev" id="lb-prev">&#8249;</button>
  <img id="lb-img" src="" alt="">
  <div class="lightbox-caption" id="lb-cap"></div>
  <button class="lightbox-nav next" id="lb-next">&#8250;</button>
</div>

<script>
const photos = [
  //{ src: "",      caption: "" },
  // add more here
];

let current = 0;
const grid = document.getElementById('gallery');
const lb   = document.getElementById('lightbox');
const lbImg = document.getElementById('lb-img');
const lbCap = document.getElementById('lb-cap');

photos.forEach((p, i) => {
  const item = document.createElement('div');
  item.className = 'gallery-item';
  item.innerHTML = `<img src="${p.src}" alt="${p.caption}" loading="lazy">
                    <div class="caption">${p.caption}</div>`;
  item.addEventListener('click', () => open(i));
  grid.appendChild(item);
});

function open(i) {
  current = i;
  lbImg.src = photos[i].src;
  lbImg.alt = photos[i].caption;
  lbCap.textContent = photos[i].caption;
  lb.classList.add('open');
}

document.getElementById('lb-close').addEventListener('click', () => lb.classList.remove('open'));
document.getElementById('lb-prev').addEventListener('click',  () => open((current - 1 + photos.length) % photos.length));
document.getElementById('lb-next').addEventListener('click',  () => open((current + 1) % photos.length));
lb.addEventListener('click', e => { if (e.target === lb) lb.classList.remove('open'); });
document.addEventListener('keydown', e => {
  if (!lb.classList.contains('open')) return;
  if (e.key === 'Escape')      lb.classList.remove('open');
  if (e.key === 'ArrowLeft')   open((current - 1 + photos.length) % photos.length);
  if (e.key === 'ArrowRight')  open((current + 1) % photos.length);
});
</script>
